name: CI

# Offline regression suite — runs on GitHub-hosted runners only.
# Design constraints (see validation/linux_w7900/07_DEFECTS_AND_FIXES.md):
#   * The 39-test suite is deliberately torch-less and GPU-less: torch is
#     stubbed where needed, so CI proves the gates (AST/generator parity,
#     dataset QA, leakage detection, A/B purity, runner artifact/kernel gates)
#     without ever installing — let alone overwriting — PyTorch in any ROCm
#     environment.
#   * Both platforms the course supports (Linux Radeon Cloud, Windows native)
#     are covered by the matrix.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies (no torch, no GPU)
        run: python -m pip install pytest nbformat pillow numpy pyyaml
      - name: Offline regression suite (AST parity, generator consistency, data QA, leakage, A/B purity, runner gates, student-action cells)
        run: python -m pytest -q
